<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 미리보기(LibreOffice) 렌더링용 글꼴 대체: 컨테이너에 없는 글꼴을 Noto CJK로 -->
<fontconfig>
  <alias binding="same">
    <family>Noto Sans KR</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>국립박물관문화재단클래식 Medium</family>
    <prefer><family>Noto Serif CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>맑은 고딕</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
  <alias binding="same">
    <family>Malgun Gothic</family>
    <prefer><family>Noto Sans CJK KR</family></prefer>
  </alias>
</fontconfig>
